name: Deploy

on:
  push:
    branches: [dev]

# One deploy at a time; a newer push waits instead of cancelling a deploy halfway through.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml

  deploy-frontend:
    needs: test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install and build
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: |
          npm install
          npm run build
          npm run bundle

      - name: Deploy to server
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          SOURCE: frontend/dist/
          TARGET: ${{ secrets.FRONTEND_DEPLOY_TARGET }}
          ARGS: "-rltgoDzvO --delete"

  deploy-backend:
    needs: test
    runs-on: ubuntu-latest

    env:
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PW: ${{ secrets.DB_PASS }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_NAME: ${{ secrets.DB_NAME }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      PORT: ${{ secrets.PORT }}
      NODE_ENV: production
      SEQUELIZE_SYNC_ALTER: ${{ secrets.SEQUELIZE_SYNC_ALTER }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Create production .env
        # dotenv does no escaping: single- and backtick-quoted values are taken literally,
        # so each value is wrapped in whichever of those quotes it does not contain.
        # Values that cannot be written safely fail the deploy instead of corrupting .env.
        run: |
          env_line() {
            local q
            case "$2" in *\\)
              echo "::error::$1 ends with a backslash, which dotenv reads as an escaped quote." >&2
              return 1 ;;
            esac
            for q in "'" '`'; do
              case "$2" in *"$q"*) ;; *) printf '%s=%s%s%s\n' "$1" "$q" "$2" "$q"; return 0 ;; esac
            done
            echo "::error::$1 contains both ' and \` and cannot be written to .env safely." >&2
            return 1
          }
          : > .env
          for key in DB_HOST DB_PW DB_USER DB_NAME AUTH_SECRET PORT NODE_ENV SEQUELIZE_SYNC_ALTER \
            GOOGLE_CLIENT_ID SMTP_HOST SMTP_PORT SMTP_SECURE SMTP_FROM SMTP_USER SMTP_PASSWORD; do
            env_line "$key" "${!key}" >> .env
          done

      - name: Bundle deploy folder
        run: npm run bundle

      - name: Deploy to server
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          ARGS: "-rltgoDzvO --delete"
          # Server-side logs and installed packages are not in the bundle; keep --delete away from them.
          EXCLUDE: "/logs/, /node_modules/"
          SOURCE: backend/deploy/
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          TARGET: ${{ secrets.BACKEND_DEPLOY_TARGET }}

      - name: Restart API service on server
        uses: JimCronqvist/action-ssh@master
        with:
          hosts: "${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }}"
          privateKey: ${{ secrets.SERVER_SSH_KEY }}
          debug: false
          command: |
            cd ${{ secrets.BACKEND_DEPLOY_TARGET }}
            npm install --omit=dev
            sudo systemctl stop vehicle-t6-backend
            sudo cp vehicle-t6-backend.service /lib/systemd/system/vehicle-t6-backend.service
            sudo systemctl daemon-reload
            sudo systemctl enable vehicle-t6-backend
            sudo systemctl start vehicle-t6-backend
